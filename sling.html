<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>末日防线</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#2b1d14;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#4a2f1b}
#app{position:absolute;left:50%;top:50%;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#e6f1ec;box-shadow:0 0 60px #000}
canvas{display:block;width:960px;height:540px;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:10px 14px;pointer-events:none}
#hud button{pointer-events:auto}
#lvName{flex:1;text-align:center;font-size:18px;font-weight:800;color:#6b4226}
button{font-family:inherit;border:0;cursor:pointer;color:#fff;font-weight:800}
.sm{padding:8px 16px;border-radius:14px;background:#e58a3a;font-size:15px;box-shadow:0 4px 0 #a85a17}
.sm:active{transform:translateY(4px);box-shadow:none}
.ov{position:absolute;inset:0;background:rgba(60,36,20,.82);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;z-index:5}
.ov.on{display:flex}
.ov h1{font-size:40px;color:#ffd65c;text-shadow:0 4px 0 #a85a17;margin-bottom:8px}
.ov p{font-size:15px;line-height:1.8;color:#ffe9cf;margin-bottom:10px}
.stars{font-size:44px;letter-spacing:6px;color:#ffd65c;margin:6px 0 14px}
.stars i{font-style:normal;color:#7a5a45}
.row{display:flex;gap:12px}
.big{padding:12px 30px;border-radius:16px;background:linear-gradient(#ffc94a,#ff9a1f);font-size:18px;box-shadow:0 5px 0 #a85a17}
.big.g{background:#8a6a55;box-shadow:0 5px 0 #4f3828}
.big:active{transform:translateY(5px);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(4,150px);gap:14px;margin-top:10px}
.lv{height:92px;border-radius:16px;background:#fff3df;color:#6b4226;box-shadow:0 5px 0 #a85a17;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lv b{font-size:24px}.lv span{font-size:12px}.lv em{font-style:normal;color:#f0a81e;font-size:15px;letter-spacing:2px}
.lv:disabled{background:#8a6a55;color:#c9b3a3;box-shadow:0 5px 0 #4f3828;cursor:default}
.lv:not(:disabled):active{transform:translateY(5px);box-shadow:none}
body,button{font-family:"Hannotate SC","HanziPen SC","Yuanti SC","Kaiti SC",cursive,sans-serif}
html,body{background:#efe6d2}
#app{background:#fff8e7;box-shadow:0 0 0 3px #5b4636,7px 9px 0 rgba(91,70,54,.25)}
#lvName{color:#5b4636;font-size:21px}
.sm,.big,.lv{border:2.5px solid #5b4636;border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:3px 4px 0 #5b4636;color:#5b4636;text-shadow:none}
.sm,.big{background:#ffe08a}.big.g{background:#e6eaef;box-shadow:3px 4px 0 #5b4636}
.lv{background:#fffdf5}.lv em{color:#f0a84a}
.lv:disabled{background:#ece5d3;color:#b3a698;border-color:#b3a698;box-shadow:3px 4px 0 #b3a698}
.sm:active,.big:active,.lv:not(:disabled):active{transform:translate(3px,4px);box-shadow:none}
.ov{background:rgba(255,248,231,.94);color:#5b4636}.ov h1{color:#ff8a7a;text-shadow:2px 3px 0 #5b4636}.ov p{color:#5b4636;font-size:16px}
.stars{color:#f5b93a;-webkit-text-stroke:1.5px #5b4636}.stars i{color:#e6dcc8}
html,body{background:#0d0e15}
#app{background:#1b1d2a;box-shadow:0 0 0 3px #efe6d6,7px 9px 0 rgba(0,0,0,.5)}
#lvName{color:#efe6d6}
.sm,.big,.lv{border-color:#efe6d6;box-shadow:3px 4px 0 #efe6d6;color:#efe6d6}
.sm,.big{background:#5a3f6b}.big.g{background:#3a3f52;box-shadow:3px 4px 0 #efe6d6}
.lv{background:#2c3044}.lv em{color:#ffc24a}
.lv:disabled{background:#20222e;color:#6a6878;border-color:#6a6878;box-shadow:3px 4px 0 #6a6878}
.ov{background:rgba(18,19,28,.94);color:#efe6d6}.ov h1{color:#ff6b7a;text-shadow:2px 3px 0 #000}.ov p{color:#efe6d6}
.stars{color:#ffc24a;-webkit-text-stroke:1.5px #efe6d6}.stars i{color:#3a3f52}
html,body{background:#0c0606}
#app{background:#2a0b10;box-shadow:0 0 0 3px #17110f,7px 9px 0 rgba(0,0,0,.6)}
#lvName{color:#f0e6d0;text-shadow:2px 2px 0 #17110f}
.sm,.big,.lv{border-color:#17110f;box-shadow:3px 4px 0 #17110f;color:#17110f}
.sm{background:#d9cdb2}.big{background:#c22a2a;color:#f0e6d0}.big.g{background:#77787f;color:#f0e6d0;box-shadow:3px 4px 0 #17110f}
.lv{background:#d9cdb2}.lv em{color:#b3261e}
.lv:disabled{background:#3a2626;color:#8a7070;border-color:#17110f;box-shadow:3px 4px 0 #17110f}
.ov{background:rgba(24,8,10,.93);color:#f0e6d0}.ov h1{color:#e0602a;text-shadow:3px 4px 0 #000}.ov p{color:#f0e6d0}
.stars{color:#f2d23a;-webkit-text-stroke:1.5px #17110f}.stars i{color:#4a2a2a}
</style></head><body>
<div id="app">
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud"><button class="sm" id="bMenu">关卡</button><div id="lvName"></div><button class="sm" id="bRe">重来</button></div>
<div id="ov" class="ov"></div>
</div>
<script>
(function(urls,i){const go=()=>{const s=document.createElement('script');s.src=urls[i];s.onload=()=>main();s.onerror=()=>{if(++i<urls.length)go();else document.getElementById('ov').className='ov on',document.getElementById('ov').innerHTML='<p>物理引擎加载失败，请检查网络后刷新</p>'};document.head.appendChild(s)};go()})(
['https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js','https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js'],0);

function main(){
const {Engine,Bodies,Body,Composite,Events}=Matter;
const W=960,H=540,G=470,OX=170,OY=372,PMAX=105,VK=.165,DT=1000/60,GR=.001*DT*DT,KD=8,THR=1.2;
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),app=$('app'),ov=$('ov');
const MAT={bis:{hp:55,den:.001,c:'#d59a55',d:'#7a4a1e'},ice:{hp:22,den:.0008,c:'#f6d873',d:'#9a7a2a'},cho:{hp:150,den:.002,c:'#bcc2cc',d:'#5a606c'},tnt:{hp:10,den:.001,c:'#f04f4f',d:'#7a1414'}};
const TG={pot:{hp:16,r:16,c:'#a8dc6c',d:'#3a4f26'},cooker:{hp:42,r:20,c:'#c59bee',d:'#2f3d52'}};
const AM={sugar:{r:11,den:.004,name:'火箭弹',tip:'火箭弹：命中就爆炸'},chili:{r:10,den:.004,name:'集束导弹',tip:'集束导弹：飞行中再点一下屏幕，分裂成三枚'},melon:{r:15,den:.005,name:'巡航导弹',tip:'巡航导弹：命中后大范围爆炸，也可以点屏幕提前引爆'},guided:{r:10,den:.004,name:'制导导弹',tip:'制导导弹：飞行中点屏幕上任意位置，导弹会转向直飞过去'}};

function kit(){const out=[];
  const B=(m,x,bot,w,h)=>out.push({k:'b',m,x,y:bot-h/2,w,h});
  const T=(t,x,bot)=>out.push({k:'t',t,x,y:bot-TG[t].r});
  const S=(x,top,w)=>out.push({k:'s',x,y:top+7,w,h:14});
  const house=(x,bot,m,t,w=64)=>{B(m,x-w/2,bot,14,64);B(m,x+w/2,bot,14,64);B(m,x,bot-64,w+30,12);if(t)T(t,x,bot);return bot-76};
  return {out,B,T,S,house}}
const LV=[
 {name:'新兵训练',ammo:['sugar','sugar','sugar'],f:k=>{k.house(660,G,'bis','pot')}},
 {name:'双子哨所',ammo:['sugar','sugar','sugar','sugar'],f:k=>{k.house(600,G,'bis','pot');k.house(790,G,'ice','pot')}},
 {name:'二层岗楼',ammo:['sugar','sugar','sugar'],f:k=>{const t=k.house(700,G,'bis','pot');k.house(700,t,'ice','pot')}},
 {name:'混凝土墙',ammo:['sugar','chili','sugar','sugar'],f:k=>{k.B('cho',560,G,24,120);k.house(670,G,'bis','pot');k.house(820,G,'ice','pot');k.B('tnt',745,G,26,26)}},
 {name:'前沿三哨',ammo:['guided','guided','chili','guided','sugar'],f:k=>{k.house(560,G,'ice','pot');k.house(690,G,'ice','pot');k.house(820,G,'ice','pot')}},
 {name:'钢筋碉堡',ammo:['guided','melon','sugar','sugar'],f:k=>{const t=k.house(710,G,'cho','cooker',70);k.T('pot',710,t);k.B('tnt',782,G,26,26)}},
 {name:'瞭望高塔',ammo:['sugar','guided','melon','sugar'],f:k=>{let t=k.house(730,G,'bis','cooker',70);t=k.house(730,t,'bis','pot',70);k.house(730,t,'ice','pot',70);k.B('tnt',802,G,26,26)}},
 {name:'总攻',ammo:['guided','chili','melon','sugar','sugar'],f:k=>{k.S(850,300,150);k.house(850,300,'ice','pot');k.house(580,G,'cho','pot',70);const t=k.house(710,G,'bis','cooker',70);k.house(710,t,'bis','pot',70);k.B('tnt',645,G,26,26)}},
];

let save={stars:[]};try{save=JSON.parse(localStorage.getItem('sling_v1'))||save}catch(e){}
const put=()=>{try{localStorage.setItem('sling_v1',JSON.stringify(save))}catch(e){}};
let engine,S=null,dead=new Set(),booms=[],noSave=false;

function add(b,g){b.g=g;Composite.add(engine.world,b);return b}
function load(i){
  engine=Engine.create();engine.positionIterations=10;engine.velocityIterations=8;
  Events.on(engine,'collisionStart',onCol);
  add(Bodies.rectangle(W/2,G+60,4000,120,{isStatic:true,friction:1}),{kind:'ground'});
  const k=kit();LV[i].f(k);let seed=1;
  for(const o of k.out){
    if(o.k==='b'){const m=MAT[o.m];add(Bodies.rectangle(o.x,o.y,o.w,o.h,{density:m.den,friction:.8,restitution:.02}),{kind:'block',m:o.m,hp:m.hp,max:m.hp,w:o.w,h:o.h,seed:seed++})}
    else if(o.k==='t'){const t=TG[o.t];add(Bodies.circle(o.x,o.y,t.r,{density:.001,friction:.6,restitution:.1}),{kind:'target',t:o.t,hp:t.hp,max:t.hp,r:t.r})}
    else add(Bodies.rectangle(o.x,o.y,o.w,o.h,{isStatic:true,friction:1}),{kind:'shelf',w:o.w,h:o.h});
  }
  S={lv:i,ammo:LV[i].ammo.slice(),state:'aim',settle:50,cur:null,ft:0,hitT:-1,fx:[],trail:[],last:[],drag:null,winT:0,wt:0,calm:0,over:false,t:0};
  dead.clear();booms=[];ov.className='ov';$('lvName').textContent=(i+1)+' · '+LV[i].name;
}
const bodies=()=>Composite.allBodies(engine.world);
const targets=()=>bodies().filter(b=>b.g.kind==='target');

function onCol(ev){
  if(S.settle>0)return;
  for(const p of ev.pairs){const a=p.bodyA,b=p.bodyB,n=p.collision.normal;
    const vn=Math.abs((a.velocity.x-b.velocity.x)*n.x+(a.velocity.y-b.velocity.y)*n.y);
    const ma=a.isStatic?1e9:a.mass,mb=b.isStatic?1e9:b.mass,imp=vn*ma*mb/(ma+mb);
    for(const s of [a,b])if(s.g.kind==='shot'){if(!s.g.hit){s.g.hit=1;if(S.hitT<0)S.hitT=S.ft}if(!s.g.bang){s.g.bang=1;booms.push(s)}}
    if(imp<THR)continue;const d=(imp-THR)*KD;hurt(a,d);hurt(b,d);
  }
}
function hurt(b,d){const g=b.g;if(g.kind!=='block'&&g.kind!=='target')return;g.hp-=d;g.flash=.18;if(g.hp<=0)dead.add(b)}
function puff(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=sp*(.3+Math.random());S.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:.5+Math.random()*.4,col,r:2+Math.random()*4})}}
function kill(b){if(b.g.gone)return;b.g.gone=1;Composite.remove(engine.world,b)}
const BM={sugar:[68,44],chili:[68,44],mini:[50,30],guided:[92,70],melon:[115,95]};
function boom(s,R=115,D=95){const k=R/115;const x=s.position.x,y=s.position.y;kill(s);
  for(const b of bodies()){if(b.isStatic)continue;const dx=b.position.x-x,dy=b.position.y-y,d=Math.hypot(dx,dy)||1;if(d>R)continue;const f=1-d/R;
    hurt(b,D*Math.sqrt(f));Body.setVelocity(b,{x:b.velocity.x+dx/d*11*k*f,y:b.velocity.y+dy/d*11*k*f-2*f})}
  puff(x,y,'#ff8a3a',8+18*k|0,3+4*k);puff(x,y,'#ffd65c',5+9*k|0,2+3*k);puff(x,y,'#5a5a5a',6*k|0,3);S.fx.push({ring:1,x,y,life:.35,R});S.shake=.3*k;S.fx.push({txt:k>.9?'轰!':'砰!',x,y:y-R*.45,life:.6})}
function fire(vx,vy,px=OX,py=OY){
  if(S.state!=='aim'||!S.ammo.length||S.over)return false;
  const type=S.ammo.shift(),a=AM[type];
  S.cur=add(Bodies.circle(px,py,a.r,{density:a.den,friction:.6,restitution:.25,frictionAir:0}),{kind:'shot',type,r:a.r});
  Body.setVelocity(S.cur,{x:vx,y:vy});Body.setAngularVelocity(S.cur,.12);
  S.state='fly';S.ft=0;S.hitT=-1;S.trail=[];return true}
function tap(tx,ty){const c=S.cur;if(S.state!=='fly'||!c||c.g.gone||c.g.used||c.g.hit)return;
  if(c.g.type==='melon'){c.g.used=1;c.g.bang=1;booms.push(c)}
  else if(c.g.type==='guided'){if(tx==null)return;const dx=tx-c.position.x,dy=ty-c.position.y,d=Math.hypot(dx,dy)||1,sp=Math.max(14,c.speed*1.15);c.g.used=1;c.g.straight=1;Body.setVelocity(c,{x:dx/d*sp,y:dy/d*sp});S.fx.push({ring:1,x:tx,y:ty,life:.35,R:22})}
  else if(c.g.type==='chili'){c.g.used=1;const v=c.velocity,sp=Math.hypot(v.x,v.y)*1.05,an=Math.atan2(v.y,v.x),{x,y}=c.position;kill(c);
    [-.2,0,.2].forEach((d,i)=>{const s=add(Bodies.circle(x,y+d*40,8,{density:.006,friction:.6,restitution:.25,frictionAir:0}),{kind:'shot',type:'mini',r:8});
      Body.setVelocity(s,{x:Math.cos(an+d)*sp,y:Math.sin(an+d)*sp});if(i===1)S.cur=s});puff(x,y,'#ffb347',10,3)}}
function tick(){
  Engine.update(engine,DT);S.t++;if(S.settle>0)S.settle--;
  for(const s of booms.splice(0))if(!s.g.gone)boom(s,...BM[s.g.type]);
  for(const b of dead){if(b.g.gone)continue;const g=b.g,{x,y}=b.position;kill(b);
    if(g.kind==='target'){puff(x,y,'#fff',14,4);puff(x,y,TG[g.t].c,8,3);S.fx.push({txt:'消灭!',x,y:y-20,life:.9})}else if(g.m==='tnt'){b.g.gone=0;boom(b)}else puff(x,y,MAT[g.m].c,8,3)}
  dead.clear();
  for(const b of bodies()){const g=b.g,p=b.position;if(b.isStatic)continue;
    if(p.x<-150||p.x>W+150||p.y>H+150){kill(b);continue}
    if(g.kind==='shot'&&!g.hit){if(g.straight)Body.applyForce(b,p,{x:0,y:-b.mass*.001});if(S.t%2===0&&S.fx.length<300)S.fx.push({sm:1,x:p.x-b.velocity.x,y:p.y-b.velocity.y,vx:0,vy:-.15,life:.55,col:'#4a4046',r:3.5})}
    if(g.kind==='shot'&&g.hit&&++g.hit>220){puff(p.x,p.y,'#fff',6,2);kill(b)}
    if(g.flash>0)g.flash-=1/60}
  if(S.state==='fly'){S.ft++;const c=S.cur;if(!c.g.gone&&!c.g.hit&&S.ft%3===0)S.trail.push([c.position.x,c.position.y]);
    if(c.g.gone||(S.hitT>=0&&S.ft-S.hitT>60)||S.ft>420){S.state=S.ammo.length?'aim':'wait';S.wt=0;S.calm=0;S.last=S.trail}}
  if(!S.over){
    if(!targets().length){if(++S.winT>45)finish(true)}
    else if(S.state==='wait'){S.wt++;let mx=0;for(const b of bodies())if(!b.isStatic)mx=Math.max(mx,b.speed);S.calm=mx<.25?S.calm+1:0;if(S.calm>50||S.wt>500)finish(false)}}
}
function finish(win){S.over=true;S.win=win;const left=S.ammo.length,st=win?(left>=2?3:left===1?2:1):0;S.stars=st;
  if(win&&!noSave){save.stars[S.lv]=Math.max(save.stars[S.lv]||0,st);put()}
  if(noSave)return;
  const last=S.lv===LV.length-1;
  ov.innerHTML=win?`<h1>${last?'全部通关！':'过关！'}</h1><div class="stars">${'★'.repeat(st)}<i>${'★'.repeat(3-st)}</i></div><p>剩余导弹 ${left} 枚</p><div class="row"><button class="big g" data-a="re">再打一次</button>${last?'<button class="big" data-a="menu">关卡</button>':'<button class="big" data-a="next">下一关</button>'}</div>`
    :`<h1>导弹打光了</h1><p>还有 ${targets().length} 只怪物没消灭，换个角度试试</p><div class="row"><button class="big g" data-a="menu">关卡</button><button class="big" data-a="re">重来</button></div>`;
  ov.className='ov on'}
function menu(){const open=save.stars.filter(s=>s>0).length;
  ov.innerHTML='<h1>末日防线</h1><p>按住屏幕向后拖，松手发射，消灭所有怪物</p><div class="grid">'+LV.map((l,i)=>{const s=save.stars[i]||0;return `<button class="lv" data-l="${i}" ${i>open?'disabled':''}><b>${i+1}</b><span>${l.name}</span><em>${i>open?'未解锁':'★'.repeat(s)+'☆'.repeat(3-s)}</em></button>`}).join('')+'</div>';
  ov.className='ov on'}
ov.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.l!=null)load(+b.dataset.l);else if(b.dataset.a==='re')load(S.lv);else if(b.dataset.a==='next')load(S.lv+1);else menu()});
$('bMenu').onclick=menu;$('bRe').onclick=()=>S&&load(S.lv);
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')S&&load(S.lv)});

// ---------- 输入 ----------
const pt=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
function pull(){const d=S.drag;if(!d)return null;let dx=d.x-d.sx,dy=d.y-d.sy;const l=Math.hypot(dx,dy);if(l>PMAX){dx*=PMAX/l;dy*=PMAX/l}
  const r=AM[S.ammo[0]].r;if(OY+dy>G-r-2)dy=G-r-2-OY;return {dx,dy,l:Math.hypot(dx,dy)}}
cv.addEventListener('pointerdown',e=>{if(!S||S.over)return;const p=pt(e);
  if(S.state==='aim'&&S.ammo.length){S.drag={sx:p.x,sy:p.y,x:p.x,y:p.y};try{cv.setPointerCapture(e.pointerId)}catch(_){}}else if(S.state==='fly')tap(p.x,p.y)});
cv.addEventListener('pointermove',e=>{if(S&&S.drag){const p=pt(e);S.drag.x=p.x;S.drag.y=p.y}});
const up=()=>{if(!S||!S.drag)return;const p=pull();S.drag=null;if(p&&p.l>14)fire(-p.dx*VK,-p.dy*VK)};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',()=>{if(S)S.drag=null});

// ---------- 绘制（蜡笔末日风） ----------
const INK='#17110f',PAPER='#d9cdb2',LITE='#f0e6d0',FONT='"Hannotate SC","HanziPen SC","Yuanti SC","Kaiti SC",cursive,sans-serif';
let C=ctx,BO=0;
function jr(seed){let t=((seed*7919+BO*10473)%233280+233280)%233280;return ()=>{t=(t*9301+49297)%233280;return t/233280-.5}}
function blob(P){const n=P.length,m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],s=m(P[n-1],P[0]);C.beginPath();C.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const e=m(P[i],P[(i+1)%n]);C.quadraticCurveTo(P[i][0],P[i][1],e[0],e[1])}C.closePath()}
